name: CI

on: push
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:

      - name: 下载代码
        uses: actions/checkout@v7

      - name: 安装Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: Ruff 检查
        run: python -m ruff check .

      - name: 格式检查
        run: python -m ruff format --check .

      - name: 类型检查
        run: python -m mypy app tests

      - name: 测试
        run: python -m pytest

